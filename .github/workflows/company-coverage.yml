name: Company data coverage check

# Manual only. Reports how complete Yahoo's company fields are for the
# universe, to decide what the stock report can show. Writes nothing.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check company field coverage
        run: python tools/company_coverage.py
