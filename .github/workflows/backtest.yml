name: Backtest indicators

# Manual only. Research run: downloads ~11 years of Yahoo data for the
# universe, tests the screener's indicators and the 20/50-day average
# crosses, and commits backtest/results/. Never touches the app's data/.
on:
  workflow_dispatch:

permissions:
  contents: write

# Own group: only writes backtest/, so it never delays the daily refresh.
concurrency:
  group: backtest
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run backtest
        run: python backtest/run_backtest.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backtest/results/
          git diff --cached --quiet && echo "No change" && exit 0
          git commit -m "Backtest results $(date -u +%Y-%m-%d)"
          git pull --rebase
          git push
