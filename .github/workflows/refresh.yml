name: Refresh screener data

on:
  schedule:
    # 15:30 UTC = 17:30 SAST, half an hour after the JSE close.
    # Weekdays only - the JSE is shut at weekends.
    - cron: '30 15 * * 1-5'
  workflow_dispatch:        # allows a manual run from the Actions tab

permissions:
  contents: write           # needed to commit the refreshed data back

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch and score JSE data
        run: python fetch_data.py

      - name: Commit refreshed data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # All data outputs, including new monthly files in data/track_record/.
          git add data/
          if git diff --staged --quiet; then
            echo "No change in the data - nothing to commit."
          else
            git commit -m "Data refresh $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
