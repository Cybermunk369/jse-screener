name: Rebuild universe

on:
  schedule:
    # 16:00 UTC = 18:00 SAST on 25 Mar / Jun / Sep / Dec - a few days after
    # the FTSE/JSE quarterly index reviews take effect.
    - cron: '0 16 25 3,6,9,12 *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run - print the new universe, commit nothing'
        type: boolean
        default: false

permissions:
  contents: write           # commit data/universe.csv
  actions: write            # kick off the data refresh afterwards

concurrency:
  group: refresh-data       # never overlap with the daily refresh's commits
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build universe
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python build_universe.py --dry-run
          else
            python build_universe.py
          fi

      - name: Commit universe and refresh data
        if: ${{ inputs.dry_run != true }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/universe.csv data/universe_meta.json
          if git diff --staged --quiet; then
            echo "Universe unchanged - nothing to commit."
          else
            git commit -m "Universe rebuild $(date -u +'%Y-%m-%d')"
            git push
            # Re-score against the new universe now rather than waiting for
            # the next weekday close.
            gh workflow run refresh.yml --ref main
          fi
